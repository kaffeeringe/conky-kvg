<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>KVG Abfahrten</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<style>
  @font-face {
    font-family: 'Doto';
    src: url('fonts/Doto-var-latin.woff2') format('woff2');
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: 'DejaVu Sans Mono';
    src: url('fonts/DejaVuSansMono.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'DejaVu Sans Mono';
    src: url('fonts/DejaVuSansMono-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    background: #000;
    color: #FFA500;
    font-family: 'Doto', "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace;
    font-weight: 900;
    font-size: 15px;
    line-height: 1.5;
  }
  .title { display: flex; justify-content: space-between; font-weight: bold; }
  #clock { font-family: 'Doto', monospace; color: #FFA500; text-align: right; font-size: 1.7em; line-height: 1.1; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  th { color: #fff; text-align: left; font-weight: normal; }
  td { white-space: nowrap; }
  .err { color: #777; }
  .col-line { width: 6ch; }
  .col-ziel { width: 23ch; }
  th:last-child, td:last-child { text-align: right; }
  .col-abf { text-align: right; width: 8ch; }
  .search { display: flex; gap: 6px; margin-bottom: 8px; }
  .search input { flex: 1; min-width: 0; background: #111; color: #FFA500; border: 1px solid #333; font: inherit; padding: 4px 6px; }
  .search button { background: #111; color: #FFA500; border: 1px solid #333; font: inherit; padding: 4px 8px; cursor: pointer; }
  .alert { color: #777; white-space: nowrap; overflow: hidden; margin-top: 6px; font-size: 0.9em; display: none; }
  .alert span { display: inline-block; padding-left: 100%; animation: marq 25s linear infinite; }
  @keyframes marq { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  thead, #name {
    font-family: 'DejaVu Sans Mono', sans-serif;
    font-size: 1.1em;
    color: white;
  }
  #name {
    font-size: 1.5em;
  }  
</style>
</head>
<body>
<div class="search">
  <input id="search" list="stoplist" placeholder="Haltestelle suchen…" autocomplete="off">
  <datalist id="stoplist"></datalist>
  <button id="nearby" type="button">Umgebung</button>
</div>
<div class="title"><span id="name"></span></div>
<table>
  <thead><tr><th class="col-line">Linie</th><th class="col-ziel">Ziel</th><th class="col-abf"><div id="clock"></div>Abfahrt</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="alert" class="alert"></div>
<script>
const params = new URLSearchParams(location.search);
let STOP = params.get('stop') || localStorage.getItem('kvg-stop') || '2387';
let NAME = params.get('name') || localStorage.getItem('kvg-name') || 'Hauptbahnhof';
const API_BASE = 'https://kvg-internetservice-proxy.p.networkteam.com/internetservice';
const apiUrl = () => API_BASE + '/services/passageInfo/stopPassages/stop?stop=' + encodeURIComponent(STOP) + '&mode=departure';

document.getElementById('name').textContent = NAME;
document.title = NAME;

function fillList(stops) {
  document.getElementById('stoplist').innerHTML =
    stops.map(s => '<option value="' + esc(s.name) + ' (' + esc(s.nr) + ')" data-nr="' + esc(s.nr) + '"></option>').join('');
}

function setStop(nr, name) {
  STOP = nr;
  NAME = name;
  localStorage.setItem('kvg-stop', nr);
  localStorage.setItem('kvg-name', name);
  const u = new URL(location.href);
  u.searchParams.set('stop', nr);
  u.searchParams.set('name', name);
  history.replaceState(null, '', u);
  document.getElementById('name').textContent = name;
  document.title = name;
  document.getElementById('search').value = name + ' (' + nr + ')';
  tick();
}

document.getElementById('search').addEventListener('change', e => {
  const opt = [...document.querySelectorAll('#stoplist option')].find(o => o.value === e.target.value);
  if (opt) setStop(opt.dataset.nr, e.target.value.replace(/ \(\d+\)$/, ''));
});

document.getElementById('nearby').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude, d = 0.01;
    try {
      const r = await fetch(API_BASE + '/geoserviceDispatcher/services/stopinfo/stops?top=' + Math.round((lat + d) * 3600000) + '&bottom=' + Math.round((lat - d) * 3600000) + '&left=' + Math.round((lon - d) * 3600000) + '&right=' + Math.round((lon + d) * 3600000));
      const j = await r.json();
      const k = lat * Math.PI / 180;
      const stops = (j.stops || []).map(s => ({
        nr: s.shortName, name: s.name, lat: s.latitude / 3600000, lon: s.longitude / 3600000
      })).map(s => ({ nr: s.nr, name: s.name, dist: Math.hypot(s.lat - lat, (s.lon - lon) * Math.cos(k)) }))
        .sort((a, b) => a.dist - b.dist).slice(0, 15);
      fillList(stops);
      document.getElementById('search').focus();
    } catch (e) {}
  });
});

async function loadStops() {
  try {
    const r = await fetch('../docs/haltestellen-kiel.csv');
    const t = await r.text();
    const stops = t.trim().split('\n').slice(1).map(l => {
      const m = l.match(/^(\d+),"((?:[^"]|"")*)",[^,]*,[^,]*,([^,]+),([^,]+)$/);
      return m ? { nr: m[1], name: m[2].replace(/""/g, '"'), lat: +m[3], lon: +m[4] } : null;
    }).filter(Boolean);
    fillList(stops);
    const cur = document.querySelector('#stoplist option[data-nr="' + STOP + '"]');
    if (cur) document.getElementById('search').value = cur.value;
  } catch (e) {}
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function tickClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

async function tick() {
  const tbody = document.getElementById('rows');
  try {
    const r = await fetch(apiUrl(), {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const al = (d.generalAlerts || []).map(a => a.title).join('   +++   ');
    const alertEl = document.getElementById('alert');
    alertEl.innerHTML = al ? '<span>' + esc(al) + '</span>' : '';
    alertEl.style.display = al ? 'block' : 'none';
    const list = (d.actual || []).slice(0, 20);
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="3" class="err">keine Abfahrten</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(p => {
      let zeit = String(p.mixedTime || '').replace(' %UNIT_MIN%', 'min');
      if (zeit === '0min') zeit = 'sofort';
      return '<tr><td class="col-line">' + esc(p.patternText) + '</td>' +
             '<td class="col-ziel">' + esc(p.direction) + '</td>' +
             '<td class="col-abf">' + esc(zeit) + '</td></tr>';
    }).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="3" class="err">API nicht erreichbar</td></tr>';
  }
}

tickClock();
tick();
loadStops();
setInterval(tickClock, 1000);
setInterval(tick, 30000);
</script>
</body>
</html>
