<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>KVG Abfahrten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    background: #000;
    color: #FFA500;
    font-family: 'Doto', "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace;
    font-weight: 900;
    font-size: 15px;
    line-height: 1.5;
  }
  thead, #name {
    font-family: sans;
    font-size: 1.1em;
    color: white;
  }
  }  
  .title { display: flex; justify-content: space-between; font-weight: bold; }
  #clock { font-size: 22px; }
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  th { color: #fff; text-align: left; font-weight: normal; }
  td { white-space: nowrap; }
  .err { color: #777; }
  .delay { color: #777; }
  .col-line { width: 5ch; }
  .col-ziel { width: 22ch; }
</style>
</head>
<body>
<div class="title"><span id="name"></span><span id="clock"></span></div>
<table>
  <thead><tr><th class="col-line">Linie</th><th class="col-ziel">Ziel</th><th>Min</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
const params = new URLSearchParams(location.search);
const STOP = params.get('stop') || '2387';
const NAME = params.get('name') || 'Hauptbahnhof';
const API = 'https://kvg-internetservice-proxy.p.networkteam.com/internetservice/services/passageInfo/stopPassages/stop?stop=' + encodeURIComponent(STOP) + '&mode=departure';

document.getElementById('name').textContent = NAME;
document.title = NAME;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function tickClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

async function tick() {
  const tbody = document.getElementById('rows');
  try {
    const r = await fetch(API, {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const list = (d.actual || []).slice(0, 20);
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="3" class="err">keine Abfahrten</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(p => {
      const zeit = String(p.mixedTime || '').replace('%UNIT_MIN%', ' Min');
      const delay = (p.actualTime && p.actualTime !== p.plannedTime)
        ? ' <span class="delay">(' + esc(p.actualTime) + ')</span>' : '';
      return '<tr><td class="col-line">' + esc(p.patternText) + '</td>' +
             '<td class="col-ziel">' + esc(p.direction) + '</td>' +
             '<td>' + esc(zeit) + delay + '</td></tr>';
    }).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="3" class="err">API nicht erreichbar</td></tr>';
  }
}

tickClock();
tick();
setInterval(tickClock, 1000);
setInterval(tick, 30000);
</script>
</body>
</html>
